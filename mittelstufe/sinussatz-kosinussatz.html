<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinussatz und Kosinussatz herleiten</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style id="typo-basis">
/* Einheitliche Schriften: Text Source Sans 3, Überschriften Source Serif 4, Zahlen Source Code Pro */
html{font-size:17px}
body{font-family:"Source Sans 3", system-ui, sans-serif}
h1,h2,h3{font-family:"Source Serif 4", Georgia, serif}
button,input,select,textarea{font-family:inherit}
code,kbd,samp,pre{font-family:"Source Code Pro", ui-monospace, monospace}
</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="../assets/lib/mathjax/tex-svg.js"></script>
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --bg:#f8fafc; --card:#ffffff; --line:#e5e7eb;
    --blue:#1d4ed8; --orange:#c2410c; --green:#15803d; --violet:#7c3aed;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Source Sans 3", system-ui, sans-serif;background:var(--bg);color:var(--ink);font-size:20px}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:23px;margin:0 12px 0 0}
  .tabs{display:flex;gap:6px}
  .tabs button,.presets button,.nav button{font:inherit;font-size:18px;border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;color:var(--ink)}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .presets{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .presets span{color:var(--muted);font-size:17px;margin-right:4px}
  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:18px;padding:18px 22px}
  @media (max-width:1000px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  #stage{padding:6px}
  #svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
  mjx-container svg{display:inline;width:auto}
  .handle{cursor:grab}
  .handle:active{cursor:grabbing}
  .hint{color:var(--muted);font-size:16px;padding:0 12px 10px}
  .side{display:flex;flex-direction:column;gap:18px}
  #explain{padding:20px 22px;min-height:340px;display:flex;flex-direction:column}
  #stepnum{color:var(--muted);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
  #title{font-size:26px;margin:4px 0 12px}
  #text{line-height:1.5;flex:1}
  #text p{margin:0 0 12px}
  .note{background:#fff7ed;border-left:4px solid var(--orange);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:18px}
  .box{background:#eff6ff;border:2px solid var(--blue);padding:8px 14px;border-radius:10px;margin:10px 0}
  .nav{display:flex;gap:10px;margin-top:14px;align-items:center}
  .nav button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .nav button:disabled{opacity:.4;cursor:default}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--blue)}
  #live{padding:16px 22px}
  #live h3{margin:0 0 10px;font-size:19px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px;font-variant-numeric:tabular-nums}
  .check{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.7}
  .check b{font-weight:600}
  .ok{color:var(--green);font-weight:600}
  .blue{color:var(--blue)} .orange{color:var(--orange)} .green{color:var(--green)}
  mjx-container[display="true"]{margin:.5em 0 !important}
</style>
</head>
<body>
<header>
  <h1>Herleitung im allgemeinen Dreieck</h1>
  <div class="tabs">
    <button id="tab-sin" class="active">Sinussatz</button>
    <button id="tab-cos">Kosinussatz</button>
  </div>
  <div class="presets">
    <span>Dreieck:</span>
    <button data-p="spitz">spitzwinklig</button>
    <button data-p="alpha">α stumpf</button>
    <button data-p="beta">β stumpf</button>
  </div>
</header>
<main>
  <section class="card" id="stage">
    <svg id="svg" viewBox="0 0 800 560" aria-label="Dreieck ABC">
      <g id="scene"></g>
      <g id="handles"></g>
    </svg>
    <div class="hint">Die Eckpunkte A, B und C lassen sich mit der Maus verschieben. Weiter mit der Pfeiltaste → oder der Leertaste.</div>
  </section>
  <section class="side">
    <div class="card" id="explain">
      <div id="stepnum"></div>
      <h2 id="title"></h2>
      <div id="text"></div>
      <div class="nav">
        <button id="prev">← Zurück</button>
        <button id="next" class="primary">Weiter →</button>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="card" id="live">
      <h3>Messwerte am aktuellen Dreieck</h3>
      <div class="grid" id="vals"></div>
      <div class="check" id="check"></div>
    </div>
  </section>
</main>

<script>
const S = 60; // Pixel pro cm
const W = 800, H = 560;
const COL = { ink:'#1f2937', gray:'#9ca3af', blue:'#1d4ed8', orange:'#c2410c', green:'#15803d', violet:'#7c3aed' };
const PRESETS = {
  spitz: { A:{x:170,y:440}, B:{x:640,y:440}, C:{x:420,y:130} },
  alpha: { A:{x:300,y:440}, B:{x:700,y:440}, C:{x:150,y:200} },
  beta:  { A:{x:100,y:440}, B:{x:500,y:440}, C:{x:650,y:200} }
};
let P = JSON.parse(JSON.stringify(PRESETS.spitz));
let mode = 'sin', step = 0, lastKey = '';

// ---------- Geometrie ----------
const sub=(p,q)=>({x:p.x-q.x,y:p.y-q.y}), add=(p,q)=>({x:p.x+q.x,y:p.y+q.y}), mul=(p,k)=>({x:p.x*k,y:p.y*k});
const dot=(p,q)=>p.x*q.x+p.y*q.y, len=p=>Math.hypot(p.x,p.y), unit=p=>{const l=len(p)||1;return {x:p.x/l,y:p.y/l}};
const deg=r=>r*180/Math.PI;
function angleAt(V,P1,P2){const u=sub(P1,V),v=sub(P2,V);return deg(Math.acos(Math.max(-1,Math.min(1,dot(u,v)/(len(u)*len(v)||1)))));}
function foot(Pt,L1,L2){const d=sub(L2,L1);const t=dot(sub(Pt,L1),d)/(dot(d,d)||1);return {F:add(L1,mul(d,t)),t};}

function compute(){
  const {A,B,C}=P;
  const a=len(sub(B,C))/S, b=len(sub(C,A))/S, c=len(sub(A,B))/S;
  const al=angleAt(A,B,C), be=angleAt(B,A,C), ga=180-al-be;
  const f=foot(C,A,B), g=foot(A,B,C);
  return {a,b,c,al,be,ga,F:f.F,t:f.t,G:g.F,tg:g.t,hc:len(sub(C,f.F))/S,ha:len(sub(A,g.F))/S,x:f.t*c};
}

// ---------- Schritte ----------
const fmt=(v,n=2)=>v.toLocaleString('de-DE',{minimumFractionDigits:n,maximumFractionDigits:n});

function notesHc(d, cos){
  let s='';
  if(d.al>90.05) s+= cos
    ? `<div class="note">Hier ist α stumpf, deshalb liegt F links von A, außerhalb der Strecke AB. Dann ist $x = b\\cdot\\cos\\alpha$ negativ und die Strecke FB hat die Länge $c - x = c + |x|$. Die Rechnung bleibt genau gleich gültig.</div>`
    : `<div class="note">Hier ist α stumpf, deshalb liegt F außerhalb der Strecke AB. Die beiden Teildreiecke sind trotzdem rechtwinklig.</div>`;
  if(d.be>90.05) s+= cos
    ? `<div class="note">Hier ist β stumpf, deshalb liegt F rechts von B. Dann ist $c - x$ negativ. Weil in der Rechnung nur $(c-x)^2$ vorkommt, ändert das nichts.</div>`
    : `<div class="note">Hier ist β stumpf, deshalb liegt F außerhalb der Strecke AB. Die beiden Teildreiecke sind trotzdem rechtwinklig.</div>`;
  return s;
}

const STEPS = {
  sin: [
    { t:'Ausgangslage', cfg:{ang:{al:1,be:1,ga:1}},
      h:d=>`<p>Gegeben ist ein beliebiges Dreieck ABC. Sinus, Kosinus und Tangens kennen wir bisher nur aus <b>rechtwinkligen</b> Dreiecken.</p><p>Gesucht ist ein Zusammenhang zwischen den Seiten und den gegenüberliegenden Winkeln, der in <b>jedem</b> Dreieck gilt.</p><p><b>Idee:</b> Wir zerlegen das Dreieck in zwei rechtwinklige Teildreiecke.</p>` },
    { t:'Die Höhe $h_c$', cfg:{hc:1},
      h:d=>`<p>Wir fällen das Lot von C auf die Gerade AB. Der Fußpunkt heißt F, die Strecke CF ist die Höhe <span class="green">$h_c$</span>.</p><p>So entstehen zwei rechtwinklige Teildreiecke: <span class="blue">AFC</span> und <span class="orange">FBC</span>.</p>${notesHc(d,false)}` },
    { t:'Linkes Teildreieck AFC', cfg:{hc:1,fill:['AFC'],side:{b:'blue'},ang:{al:'blue'},supA:1},
      h:d=>`<p>Im rechtwinkligen Dreieck AFC ist <span class="blue">$b$</span> die Hypotenuse und $h_c$ die Gegenkathete von <span class="blue">$\\alpha$</span>:</p>$$\\sin\\alpha = \\frac{h_c}{b} \\quad\\Rightarrow\\quad h_c = b\\cdot\\sin\\alpha$$${d.al>90.05?`<div class="note">Da α stumpf ist, liegt im Teildreieck AFC der Winkel $180^\\circ-\\alpha$. Es gilt aber $\\sin(180^\\circ-\\alpha)=\\sin\\alpha$, also bleibt $h_c = b\\cdot\\sin\\alpha$ richtig.</div>`:''}` },
    { t:'Rechtes Teildreieck FBC', cfg:{hc:1,fill:['FBC'],side:{a:'orange'},ang:{be:'orange'},supB:1},
      h:d=>`<p>Im rechtwinkligen Dreieck FBC ist <span class="orange">$a$</span> die Hypotenuse und $h_c$ die Gegenkathete von <span class="orange">$\\beta$</span>:</p>$$\\sin\\beta = \\frac{h_c}{a} \\quad\\Rightarrow\\quad h_c = a\\cdot\\sin\\beta$$${d.be>90.05?`<div class="note">Da β stumpf ist, liegt im Teildreieck FBC der Winkel $180^\\circ-\\beta$. Wegen $\\sin(180^\\circ-\\beta)=\\sin\\beta$ bleibt $h_c = a\\cdot\\sin\\beta$ richtig.</div>`:''}` },
    { t:'Gleichsetzen', cfg:{hc:1,fill:['AFC','FBC'],side:{a:'orange',b:'blue'},ang:{al:'blue',be:'orange'}},
      h:d=>`<p>Beide Terme beschreiben dieselbe Höhe $h_c$. Also gilt:</p>$$b\\cdot\\sin\\alpha = a\\cdot\\sin\\beta$$<p>Wir teilen durch $\\sin\\alpha\\cdot\\sin\\beta$ (beide Werte sind ungleich 0, weil die Winkel zwischen 0° und 180° liegen):</p>$$\\frac{a}{\\sin\\alpha} = \\frac{b}{\\sin\\beta}$$` },
    { t:'Dasselbe mit der Höhe $h_a$', cfg:{ha:1,fill:['ABG','AGC'],side:{c:'blue',b:'orange'},ang:{be:'blue',ga:'orange'}},
      h:d=>`<p>Genauso können wir das Lot von A auf die Gerade BC fällen. Mit der Höhe <span class="green">$h_a$</span> erhalten wir:</p>$$h_a = c\\cdot\\sin\\beta \\quad\\text{und}\\quad h_a = b\\cdot\\sin\\gamma$$<p>Gleichsetzen und Umformen liefert:</p>$$\\frac{b}{\\sin\\beta} = \\frac{c}{\\sin\\gamma}$$` },
    { t:'Ergebnis: der Sinussatz', cfg:{side:{a:'violet',b:'violet',c:'violet'},ang:{al:'violet',be:'violet',ga:'violet'}},
      h:d=>`<div class="box">$$\\frac{a}{\\sin\\alpha} = \\frac{b}{\\sin\\beta} = \\frac{c}{\\sin\\gamma}$$</div><p>In jedem Dreieck ist das Verhältnis aus einer Seite und dem Sinus des gegenüberliegenden Winkels gleich groß.</p><p>Probiere es aus: Verschiebe die Ecken und beobachte die drei Quotienten unten.</p>` }
  ],
  cos: [
    { t:'Ausgangslage', cfg:{ang:{al:1}},
      h:d=>`<p>Gesucht ist ein Zusammenhang zwischen den <b>drei Seiten</b> und <b>einem Winkel</b> eines beliebigen Dreiecks.</p><p>Für rechtwinklige Dreiecke kennen wir den Satz des Pythagoras.</p><p><b>Idee:</b> Wir zeichnen eine Höhe ein und wenden den Satz des Pythagoras in beiden Teildreiecken an.</p>` },
    { t:'Die Höhe $h_c$ teilt die Seite $c$', cfg:{hc:1,xlab:1},
      h:d=>`<p>Wir fällen das Lot von C auf die Gerade AB mit Fußpunkt F. Die Höhe <span class="green">$h_c$</span> teilt die Seite $c$ in zwei Abschnitte:</p>$$\\overline{AF} = x \\qquad \\overline{FB} = c - x$$${notesHc(d,true)}` },
    { t:'Linkes Teildreieck AFC', cfg:{hc:1,xlab:1,fill:['AFC'],side:{b:'blue'},xseg:'blue',ang:{al:'blue'}},
      h:d=>`<p>Im rechtwinkligen Dreieck AFC gilt nach Pythagoras:</p>$$b^2 = x^2 + h_c^2$$<p>Außerdem ist $x$ die Ankathete von <span class="blue">$\\alpha$</span>:</p>$$\\cos\\alpha = \\frac{x}{b} \\quad\\Rightarrow\\quad x = b\\cdot\\cos\\alpha$$${notesHc(d,true)}` },
    { t:'Rechtes Teildreieck FBC', cfg:{hc:1,xlab:1,fill:['FBC'],side:{a:'orange'},cxseg:'orange'},
      h:d=>`<p>Im rechtwinkligen Dreieck FBC gilt nach Pythagoras:</p>$$a^2 = h_c^2 + (c - x)^2$$${notesHc(d,true)}` },
    { t:'Einsetzen und vereinfachen', cfg:{hc:1,xlab:1,fill:['AFC','FBC'],side:{a:'orange',b:'blue'}},
      h:d=>`<p>Aus dem linken Teildreieck folgt $h_c^2 = b^2 - x^2$. Das setzen wir rechts ein und lösen die Klammer auf:</p>$$\\begin{aligned} a^2 &= b^2 - x^2 + (c-x)^2 \\\\ &= b^2 - x^2 + c^2 - 2cx + x^2 \\\\ &= b^2 + c^2 - 2cx \\end{aligned}$$<p>Die Höhe $h_c$ ist verschwunden.</p>` },
    { t:'Ergebnis: der Kosinussatz', cfg:{side:{a:'violet',b:'violet',c:'violet'},ang:{al:'violet'}},
      h:d=>`<p>Jetzt ersetzen wir $x$ durch $b\\cdot\\cos\\alpha$:</p><div class="box">$$a^2 = b^2 + c^2 - 2bc\\cdot\\cos\\alpha$$</div><p>Ebenso (mit einer anderen Höhe) erhält man:</p>$$b^2 = a^2 + c^2 - 2ac\\cdot\\cos\\beta$$$$c^2 = a^2 + b^2 - 2ab\\cdot\\cos\\gamma$$` },
    { t:'Spezialfall: Satz des Pythagoras', cfg:{side:{a:'violet'},ang:{al:'violet'}},
      h:d=>`<p>Ist $\\alpha = 90^\\circ$, so gilt $\\cos 90^\\circ = 0$ und der Kosinussatz wird zu</p>$$a^2 = b^2 + c^2.$$<p>Der Satz des Pythagoras ist also ein Spezialfall des Kosinussatzes. Der Term $-2bc\\cdot\\cos\\alpha$ wirkt wie ein Korrekturterm: Für $\\alpha < 90^\\circ$ ist $a^2$ kleiner als $b^2+c^2$, für $\\alpha > 90^\\circ$ größer.</p><p><button id="make90" style="font:inherit;font-size:18px;padding:8px 14px;border-radius:10px;border:1px solid #7c3aed;background:#f5f3ff;color:#5b21b6;cursor:pointer">α auf 90° setzen</button></p>` }
  ]
};

// ---------- Zeichnen ----------
function line(p,q,col,w,dash){return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}/>`;}
function text(p,s,col,size=26,extra=''){return `<text x="${p.x}" y="${p.y}" fill="${col}" font-size="${size}" font-family="Georgia,'Times New Roman',serif" font-style="italic" text-anchor="middle" dominant-baseline="central" ${extra}>${s}</text>`;}
function poly(pts,col){return `<polygon points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="${col}" fill-opacity="0.16" stroke="none"/>`;}
function arc(V,P1,P2,r,col,w,label,lr){
  const u=unit(sub(P1,V)),v=unit(sub(P2,V));
  const s=add(V,mul(u,r)),e=add(V,mul(v,r));
  const cr=u.x*v.y-u.y*v.x, sweep=cr>0?1:0;
  const bis=unit(add(u,v));
  let out=`<path d="M${V.x},${V.y} L${s.x},${s.y} A${r},${r} 0 0 ${sweep} ${e.x},${e.y} Z" fill="${col}" fill-opacity="0.18" stroke="none"/>`;
  out+=`<path d="M${s.x},${s.y} A${r},${r} 0 0 ${sweep} ${e.x},${e.y}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
  if(label) out+=text(add(V,mul(bis,r+(lr||20))),label,col,24);
  return out;
}
function rightMark(Fp,toC,along,col){
  const k=15,u=unit(toC),v=unit(along);
  const p1=add(Fp,mul(v,k)),p2=add(p1,mul(u,k)),p3=add(Fp,mul(u,k));
  return `<path d="M${p1.x},${p1.y} L${p2.x},${p2.y} L${p3.x},${p3.y}" fill="none" stroke="${col}" stroke-width="2"/>`;
}
function sideLabel(p,q,opp,s,col,dist=24,size=26){
  const m=mul(add(p,q),.5); const d=sub(q,p); let n=unit({x:-d.y,y:d.x});
  if(dot(n,sub(opp,m))>0) n=mul(n,-1);
  return text(add(m,mul(n,dist)),s,col,size,'font-weight="bold"');
}

function draw(){
  const d=compute(), {A,B,C}=P, F=d.F, G=d.G;
  const st=STEPS[mode][step], cfg=st.cfg;
  const colOf=k=>{const v=cfg.side&&cfg.side[k];return v?COL[v]:COL.ink;};
  const wOf=k=>(cfg.side&&cfg.side[k])?5:3;
  const fills={AFC:[A,F,C],FBC:[F,B,C],ABG:[A,B,G],AGC:[A,G,C]};
  const fillCol={AFC:COL.blue,FBC:COL.orange,ABG:COL.blue,AGC:COL.orange};
  let g='';

  (cfg.fill||[]).forEach(k=>g+=poly(fills[k],fillCol[k]));

  // Verlängerungen
  if(cfg.hc){ if(d.t<0) g+=line(A,F,COL.gray,2,'7 6'); if(d.t>1) g+=line(B,F,COL.gray,2,'7 6'); }
  if(cfg.ha){ if(d.tg<0) g+=line(B,G,COL.gray,2,'7 6'); if(d.tg>1) g+=line(C,G,COL.gray,2,'7 6'); }

  // Winkel
  const ang=cfg.ang||{};
  const aCol=k=>ang[k]===1?COL.ink:(ang[k]?COL[ang[k]]:null);
  if(aCol('al')) g+=arc(A,B,C,40,aCol('al'),ang.al===1?1.5:3,'α');
  if(aCol('be')) g+=arc(B,A,C,40,aCol('be'),ang.be===1?1.5:3,'β');
  if(aCol('ga')) g+=arc(C,A,B,40,aCol('ga'),ang.ga===1?1.5:3,'γ');
  if(cfg.supA && d.t<0 && len(sub(F,A))>8) g+=arc(A,F,C,30,COL.blue,2,'180°−α',42);
  if(cfg.supB && d.t>1 && len(sub(F,B))>8) g+=arc(B,F,C,30,COL.orange,2,'180°−β',42);

  // Seiten
  g+=line(A,B,colOf('c'),wOf('c'))+line(B,C,colOf('a'),wOf('a'))+line(C,A,colOf('b'),wOf('b'));
  if(cfg.xseg) g+=line(A,F,COL[cfg.xseg],6);
  if(cfg.cxseg) g+=line(F,B,COL[cfg.cxseg],6);

  // Höhen
  if(cfg.hc){
    g+=line(C,F,COL.green,3.5);
    const along = len(sub(B,F))>1 ? sub(B,F) : sub(A,F);
    g+=rightMark(F,sub(C,F),d.t>1?sub(A,F):along,COL.green);
    g+=`<circle cx="${F.x}" cy="${F.y}" r="5" fill="${COL.green}"/>`;
    const n=unit({x:-(B.y-A.y),y:B.x-A.x}); const away=dot(n,sub(C,A))>0?mul(n,-1):n;
    g+=text(add(F,mul(away,24)),'F',COL.green,24,'font-style="normal"');
    const hm=mul(add(C,F),.5), hd=unit(sub(C,F)); const side=dot({x:-hd.y,y:hd.x},sub(B,A))>0?1:-1;
    g+=text(add(hm,mul({x:-hd.y,y:hd.x},20*side*(d.t>1?-1:1))),'h<tspan font-size="17" dy="6">c</tspan>',COL.green,26,'font-weight="bold"');
  }
  if(cfg.ha){
    g+=line(A,G,COL.green,3.5);
    const along = len(sub(C,G))>1 ? sub(C,G) : sub(B,G);
    g+=rightMark(G,sub(A,G),d.tg>1?sub(B,G):along,COL.green);
    g+=`<circle cx="${G.x}" cy="${G.y}" r="5" fill="${COL.green}"/>`;
    const hm=mul(add(A,G),.5), hd=unit(sub(A,G)); let nn={x:-hd.y,y:hd.x}; if(dot(nn,sub(C,G))<0) nn=mul(nn,-1);
    g+=text(add(hm,mul(nn,-22)),'h<tspan font-size="17" dy="6">a</tspan>',COL.green,26,'font-weight="bold"');
  }

  // Abschnitte x und c−x
  if(cfg.xlab){
    const n=unit({x:-(B.y-A.y),y:B.x-A.x}); const away=dot(n,sub(C,A))>0?mul(n,-1):n;
    if(len(sub(F,A))>20) g+=text(add(mul(add(A,F),.5),mul(away,24)),d.t<0?'|x|':'x',cfg.xseg?COL[cfg.xseg]:COL.ink,24,'font-weight="bold"');
    if(len(sub(B,F))>20) g+=text(add(mul(add(F,B),.5),mul(away,24)),d.t>1?'|c − x|':'c − x',cfg.cxseg?COL[cfg.cxseg]:COL.ink,24,'font-weight="bold"');
  }

  // Seitenbeschriftungen
  g+=sideLabel(B,C,A,'a',colOf('a'));
  g+=sideLabel(C,A,B,'b',colOf('b'));
  g+=sideLabel(A,B,C,'c',colOf('c'),cfg.xlab?56:26);

  document.getElementById('scene').innerHTML=g;

  // Eckpunkte
  const cen=mul(add(add(A,B),C),1/3); let h='';
  ['A','B','C'].forEach(k=>{
    const p=P[k], o=add(p,mul(unit(sub(p,cen)),30));
    h+=`<circle cx="${p.x}" cy="${p.y}" r="22" fill="transparent" class="handle" data-k="${k}"/>`;
    h+=`<circle cx="${p.x}" cy="${p.y}" r="8" fill="#fff" stroke="${COL.ink}" stroke-width="3" class="handle" data-k="${k}"/>`;
    h+=text(o,k,COL.ink,28,'font-style="normal" font-weight="bold" pointer-events="none"');
  });
  document.getElementById('handles').innerHTML=h;

  updateText(d);
  updateLive(d);
}

function updateText(d){
  const key=mode+step+'|'+(d.al>90.05)+(d.be>90.05);
  if(key===lastKey) return; lastKey=key;
  const st=STEPS[mode][step], n=STEPS[mode].length;
  document.getElementById('stepnum').textContent=`Schritt ${step+1} von ${n}`;
  const t=document.getElementById('title'), x=document.getElementById('text');
  t.innerHTML=st.t; x.innerHTML=st.h(d);
  document.getElementById('prev').disabled=step===0;
  document.getElementById('next').disabled=step===n-1;
  document.getElementById('dots').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');
  const b90=document.getElementById('make90'); if(b90) b90.onclick=make90;
  if(window.MathJax&&MathJax.typesetPromise){ MathJax.typesetClear&&MathJax.typesetClear([t,x]); MathJax.typesetPromise([t,x]).catch(()=>{}); }
}

function updateLive(d){
  document.getElementById('vals').innerHTML=
    `<div>a = ${fmt(d.a)} cm</div><div>b = ${fmt(d.b)} cm</div><div>c = ${fmt(d.c)} cm</div>`+
    `<div>α = ${fmt(d.al,1)}°</div><div>β = ${fmt(d.be,1)}°</div><div>γ = ${fmt(d.ga,1)}°</div>`;
  const r=Math.PI/180; let s='';
  if(mode==='sin'){
    s=`<div><b>a / sin α</b> = ${fmt(d.a/Math.sin(d.al*r))}</div><div><b>b / sin β</b> = ${fmt(d.b/Math.sin(d.be*r))}</div><div><b>c / sin γ</b> = ${fmt(d.c/Math.sin(d.ga*r))}</div><div class="ok">✓ Alle drei Quotienten stimmen überein.</div>`;
  } else {
    const rhs=d.b*d.b+d.c*d.c-2*d.b*d.c*Math.cos(d.al*r);
    s=`<div><b>a²</b> = ${fmt(d.a*d.a)}</div><div><b>b² + c² − 2bc · cos α</b> = ${fmt(rhs)}</div><div><b>b² + c²</b> = ${fmt(d.b*d.b+d.c*d.c)} <span style="color:#6b7280">(nur bei α = 90° gleich a²)</span></div><div class="ok">✓ Der Kosinussatz stimmt.</div>`;
  }
  document.getElementById('check').innerHTML=s;
}

// ---------- Interaktion ----------
const svg=document.getElementById('svg'); let drag=null;
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(30,Math.min(W-30,q.x)),y:Math.max(30,Math.min(H-30,q.y))};}
svg.addEventListener('pointerdown',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){drag=k;svg.setPointerCapture(e.pointerId);e.preventDefault();}});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPt(e);
  const others=['A','B','C'].filter(k=>k!==drag);
  if(others.every(k=>len(sub(p,P[k]))>25)){P[drag]=p;draw();}});
svg.addEventListener('pointerup',()=>drag=null);
svg.addEventListener('pointercancel',()=>drag=null);

function go(i){const n=STEPS[mode].length;step=Math.max(0,Math.min(n-1,i));lastKey='';draw();}
document.getElementById('next').onclick=()=>go(step+1);
document.getElementById('prev').onclick=()=>go(step-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(step+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(step-1);}
});
function setMode(m){mode=m;step=0;lastKey='';
  document.getElementById('tab-sin').classList.toggle('active',m==='sin');
  document.getElementById('tab-cos').classList.toggle('active',m==='cos');draw();}
document.getElementById('tab-sin').onclick=()=>setMode('sin');
document.getElementById('tab-cos').onclick=()=>setMode('cos');
document.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>{P=JSON.parse(JSON.stringify(PRESETS[b.dataset.p]));lastKey='';draw();});

function make90(){
  const {A,B,C}=P; const u=unit(sub(B,A)); let n={x:-u.y,y:u.x};
  if(dot(n,sub(C,A))<0) n=mul(n,-1);
  const b=Math.min(len(sub(C,A)),A.y-40);
  let Cn=add(A,mul(n,b)); Cn={x:Math.max(30,Math.min(W-30,Cn.x)),y:Math.max(30,Math.min(H-30,Cn.y))};
  P.C=Cn; lastKey=''; draw();
}

draw();
window.addEventListener('load',()=>{lastKey='';draw();});
</script>
</body>
</html>
