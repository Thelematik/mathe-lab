<style>
/* Layout: Karopapier als Grund, kompakte Kopfzeile mit Reitern, darunter je Reiter Merke, Beispiel, Anschauung, Übung */
:root{
  --paper:#f6f8fb; --grid:#e2e9f1; --panel:#ffffff; --ink:#18212c; --muted:#56616f; --line:#cdd6e1;

  --hl:#ffe680; --hl-ink:#18212c; --merke:#fff9de; --merke-line:#d9b84a; --btn:#18212c; --btn-ink:#ffffff;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151c; --grid:#1a222c; --panel:#171f29; --ink:#e7edf4; --muted:#9ca8b6; --line:#2c3746;
  --x:#7eabff; --x-soft:#1c2c48; --y:#5fd39a; --y-soft:#163426; --v:#c59eff; --v-soft:#2b2140;
  --red:#ff7f72; --red-soft:#3c1f1c; --n:#a9b3bf; --n-soft:#242d38;
  --hl:#6a5812; --hl-ink:#fff5cc; --merke:#25220f; --merke-line:#8c762a; --btn:#e7edf4; --btn-ink:#10151c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151c; --grid:#1a222c; --panel:#171f29; --ink:#e7edf4; --muted:#9ca8b6; --line:#2c3746;
  --x:#7eabff; --x-soft:#1c2c48; --y:#5fd39a; --y-soft:#163426; --v:#c59eff; --v-soft:#2b2140;
  --red:#ff7f72; --red-soft:#3c1f1c; --n:#a9b3bf; --n-soft:#242d38;
  --hl:#6a5812; --hl-ink:#fff5cc; --merke:#25220f; --merke-line:#8c762a; --btn:#e7edf4; --btn-ink:#10151c;
  color-scheme:dark}
html{font-size:18px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px 4px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px;flex:1 1 auto;min-width:0}

.tools button{font:inherit;font-size:.85rem;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-height:40px;min-width:44px;padding:0 10px;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1500px;margin:0 auto;padding-block:6px 0;scrollbar-width:thin}

.tb .tn{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--line);font-weight:700;font-size:.85em;font-variant-numeric:tabular-nums}
.tb[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

main{max-width:1500px;margin:0 auto;padding-block:22px 40px}

.lead{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.intro{min-width:0}

.task{font-size:1.15rem;margin:0 0 10px}

.bang{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--red);color:var(--panel);font-weight:700}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}

.live{display:grid;gap:4px;font-size:1.3rem;overflow-x:auto;padding:4px 0}
.unit{font-family:var(--f-ui);font-size:.7em;color:var(--muted);margin-left:.4em}
.cap{color:var(--muted);margin:8px 0 0;font-size:.95rem}
.cmp{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;border:1px dashed var(--line);border-radius:8px;font-size:1.15rem}

.c1{stroke:var(--x)} .c2{stroke:var(--v)} .c3{stroke:var(--red)} .c4{stroke:var(--y)}
.mk{stroke:none} .mk.c1{fill:var(--x)} .mk.c2{fill:var(--v)} .mk.c3{fill:var(--red)} .mk.c4{fill:var(--y)}
.badge{fill:var(--panel);stroke-width:2.5}
.sv text.bt,.arcs text.bt{font-family:var(--f-ui);font-weight:700;fill:var(--ink)}
/* Sortierer */
.sorter{display:grid;gap:10px;min-height:9rem;align-content:start}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:baseline;gap:.15em;font-family:var(--f-math);font-size:1.5rem;padding:4px 12px;border-radius:8px;border:2px solid;animation:pop .35s ease-out}
.chip b{font-weight:400}
.k-x{background:var(--x-soft);border-color:var(--x)} .k-y{background:var(--y-soft);border-color:var(--y)} .k-n{background:var(--n-soft);border-color:var(--n)}
.chip .v{color:inherit}
.lane{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ll{width:6.5em;color:var(--muted);font-size:.9rem}
.eq{font-family:var(--f-math);font-size:1.5rem}
.chip.res{font-weight:600;border-style:double;border-width:4px}
.big{font-size:1.8rem;overflow-x:auto}
/* Minusklammer */
.flip{font-family:var(--f-math);font-size:2.3rem;padding:18px 0 8px;white-space:nowrap;overflow-x:auto}
.flip span{display:inline-block;transition:opacity .3s,color .3s,background .3s}

/* Entscheidungshilfe */
.dec{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:d}
.dec li{counter-increment:d;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;transition:background .25s,border-color .25s}
.dec li::before{content:counter(d);grid-row:span 2;display:grid;place-items:center;width:2em;height:2em;border-radius:50%;border:1.5px solid var(--line);font-weight:700}
.dec .dq{font-weight:700}
.dec .da{color:var(--muted)}
.dec li.on{background:var(--hl);border-color:var(--merke-line);color:var(--hl-ink)}
.dec li.on .da{color:var(--hl-ink)}
.dec li.on::before{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media (max-width:980px){.lead,.grid2,.grid2.b{grid-template-columns:1fr}}
@media (max-width:560px){html{font-size:16px}.sm{font-size:1.45rem}.intro h2{font-size:1.6rem}.tb .tl{font-size:.85rem}.flip{font-size:1.7rem}.chip{font-size:1.2rem}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ---------- Hilfsfunktionen ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const nz=(a,b)=>{let v;do v=rnd(a,b);while(v===0);return v};
const sgn=()=>Math.random()<.5?-1:1;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sn=n=>n<0?`(${n})`:`${n}`;
function mono(c,v,first){const a=Math.abs(c);const body=v?(a===1?'':a)+v:String(a);return first?(c<0?'-':'')+body:(c<0?' - ':' + ')+body}
function poly(ts){const f=ts.filter(t=>t[0]!==0);if(!f.length)return'0';return f.map((t,k)=>mono(t[0],t[1],k===0)).join('')}
function combine(ts){const m=new Map();ts.forEach(([c,v])=>m.set(v,(m.get(v)||0)+c));return[...m].map(([v,c])=>[c,v])}

/* Mini-Satz für Terme: Variablen kursiv und farbig, Malpunkt, Minuszeichen, Hochzahl, Bruch, [[Markierung]], "Text" */
function M(src){
  let i=0,last='start';const isD=c=>c>='0'&&c<='9';
  const vc=c=>c==='x'?'vx':c==='y'?'vy':'vo';
  function go(end){
    let h='';
    while(i<src.length){
      if(end&&src.startsWith(end,i)){i+=end.length;return h}
      const c=src[i];
      if(src.startsWith('[[',i)){i+=2;h+='<span class="hl">'+go(']]')+'</span>';continue}
      if(src.startsWith('frac{',i)){i+=5;const a=go('}');if(src[i]==='{')i++;const b=go('}');h+=`<span class="fr"><span class="fn">${a}</span><span class="fd">${b}</span></span>`;last='atom';continue}
      if(c==='"'){const j=src.indexOf('"',i+1);h+='<span class="tx">'+esc(src.slice(i+1,j))+'</span>';i=j+1;last='op';continue}
      if(c===' '){i++;continue}
      if(isD(c)){let j=i;while(j<src.length&&isD(src[j]))j++;h+=src.slice(i,j);i=j;last='atom';continue}
      if(/[a-zA-Z]/.test(c)){h+=`<i class="v ${vc(c)}">${c}</i>`;i++;last='atom';continue}
      if(c==='^'){i++;let j=i;while(j<src.length&&isD(src[j]))j++;if(j===i)j=i+1;h+='<sup>'+esc(src.slice(i,j))+'</sup>';i=j;last='atom';continue}
      i++;
      if(c==='*'){h+='<span class="op">·</span>';last='op';continue}
      if(c==='+'||c==='='||c==='≠'){h+=`<span class="op">${c}</span>`;last='op';continue}
      if(c==='-'){h+=last==='atom'?'<span class="op">−</span>':'−';last='op';continue}
      if(c===':'){h+=src[i-2]===' '?'<span class="op">:</span>':':<span class="gap"></span>';last='op';continue}
      if(c===','){h+=',<span class="gap"></span>';last='op';continue}
      if(c==='('){h+='(';last='open';continue}
      if(c===')'){h+=')';last='atom';continue}
      h+=esc(c);last='atom';
    }
    return h;
  }
  return go(null);
}
const T=s=>s.replace(/\$([^$]+)\$/g,(_,m)=>`<span class="mi">${M(m)}</span>`);
const mi=s=>`<div class="mi">${M(s)}</div>`;

/* SVG-Bausteine */
function sv(str,fs){let h='',back=false;
  for(let i=0;i<str.length;i++){const c=str[i];let p;
    if(c===' ')continue;
    if(c==='^'){h+=`<tspan dy="${-0.42*fs}" font-size="${0.66*fs}">${esc(str[++i])}</tspan>`;back=true;continue}
    if(/[a-z]/.test(c))p=`<tspan class="t-${c==='x'?'x':c==='y'?'y':'o'}" font-style="italic">${c}</tspan>`;
    else if(c==='-')p=' − ';else if(c==='+')p=' + ';else if(c==='*')p='·';else p=esc(c);
    if(back){p=`<tspan dy="${0.42*fs}">${p}</tspan>`;back=false}
    h+=p}
  if(back)h+=`<tspan dy="${0.42*fs}">​</tspan>`;
  return h}
const svg=(w,h,inner)=>`<svg class="sv" viewBox="0 0 ${w} ${h}" role="img" aria-hidden="true">${inner}</svg>`;
const tx=(x,y,str,fs,cls='',anchor='middle')=>`<text class="${cls}" x="${x}" y="${y}" font-size="${fs}" text-anchor="${anchor}" xml:space="preserve">${sv(str,fs)}</text>`;
function box(x,y,w,h,cls,label){
  let s=cls?`<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`:'';
  if(label){const len=label.replace(/\^./g,'').replace(/ /g,'').length+(/[-+]/.test(label)?1.2:0);
    const fs=Math.min(28,h*0.42,(w-8)/(len*0.62));if(fs>=11)s+=tx(x+w/2,y+h/2+fs*0.34,label,fs)}
  return s}
const sl=(id,name,min,max,val,suf='')=>`<label class="sl" for="${id}"><span class="sl-l"><span class="mi">${M(name)}</span> = <b id="${id}-v">${val}</b>${suf?`<span class="mi">${M(suf)}</span>`:''}</span><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="1"></label>`;

let arcN=0;
function arcFig(tokens,arcs){
  const fs=38,id='af'+(arcN++),base=118;
  const ws=tokens.map(t=>{const n=t.replace(/\^./g,'').length+(/\^/.test(t)?.5:0);return n*fs*.56+(/^[+\-*]$/.test(t)?24:6)});
  let x=24;const cx=ws.map(w=>{const c=x+w/2;x+=w;return c});
  const below=arcs.some(a=>a[3]==='b'),H=below?226:140,cls=['c1','c2','c3','c4'];
  let h='';

function makeStepper(box,{start=1,onStep}={}){
  let steps=[],k=start;const list=box.querySelector('.steps');
  function render(){
    if(k===0)list.innerHTML='<p class="ph">Erst selbst rechnen, dann Schritt für Schritt aufdecken.</p>';
    else list.innerHTML=steps.slice(0,k).map((s,j)=>`<div class="step${j===k-1&&k>start?' cur':''}"><div class="sm">${M(s.m)}</div>${s.n?`<div class="sn">${T(s.n)}</div>`:''}</div>`).join('');
    box.querySelectorAll('[data-a=next],[data-a=all]').forEach(b=>b.disabled=k>=steps.length);
    box.querySelectorAll('[data-a=prev]').forEach(b=>b.disabled=k<=start);
    const c=box.querySelector('.cnt');if(c)c.textContent=`Schritt ${k-start} von ${steps.length-start}`;
    onStep&&onStep(steps[k-1]);
  }
  return{load(s){steps=s;k=start;render()},next(){if(k<steps.length){k++;render()}},prev(){if(k>start){k--;render()}},reset(){k=start;render()},all(){k=steps.length;render()}};
}

  return{task:`Ein Rechteck hat die Länge $l = ${poly([[a,'x'],[b,'']])}$ und die Breite $b = ${mono(c,'x',true)}$. Stelle einen Term für den Umfang $U$ auf und berechne ihn für $x = ${k}$.`,
  steps:[{m:'U = l + b + l + b',n:'Umfang: alle vier Seiten addieren'},{m:'U = '+poly(raw),n:'Seitenlängen einsetzen'},{m:'U = '+poly(sorted),n:'Gleichartige Glieder sortieren'},{m:'U = '+poly([[A,'x'],[2*b,'']]),n:'Zusammenfassen'},{m:`"Für "x = ${k}": "U = ${A}*${k} + ${2*b} = ${A*k+2*b}`,n:'Termwert berechnen'}]}}
function gen2(){const set=pick([['x','y',''],['x^2','x',''],['ab','a','b']]);let ts=[];set.forEach(v=>ts.push([nz(-9,9),v],[nz(-9,9),v]));ts=shuffle(ts);
  const sorted=set.flatMap(v=>ts.filter(t=>t[1]===v));
  return{task:`Fasse zusammen: $${poly(ts)}$`,steps:[{m:poly(sorted),n:'Nach Sorten ordnen, die Vorzeichen wandern mit'},{m:poly(combine(sorted)),n:'Koeffizienten jeder Sorte zusammenrechnen'}]}}
function gen3(){const ty=rnd(1,4);
  if(ty===1){const a=rnd(2,7)*sgn(),b=rnd(2,7)*sgn();return{task:`Multipliziere: $${mono(a,'x',true)} * ${b<0?`(${mono(b,'y',true)})`:mono(b,'y',true)}$`,steps:[{m:`${a}*${sn(b)}*x*y`,n:'Zahlen nach vorne, Variablen nach hinten'},{m:mono(a*b,'xy',true),n:'Zahlen multiplizieren, Vorzeichenregel beachten'}]}}
  if(ty===2){const a=rnd(2,7)*sgn(),b=rnd(2,7)*sgn();return{task:`Multipliziere: $${mono(a,'x',true)} * ${b<0?`(${mono(b,'x',true)})`:mono(b,'x',true)}$`,steps:[{m:`${a}*${sn(b)}*x*x`,n:'Zahlen nach vorne, Variablen nach hinten'},{m:mono(a*b,'x^2',true),n:'$x * x = x^2$'}]}}
  const a=rnd(2,6),b=rnd(2,8)*sgn(),N=a*b;

  return{task:`Dividiere: $${mono(N,'x^2',true)} : ${a}x$`,steps:[{m:`frac{${mono(N,'x^2',true)}}{${a}x}`,n:'Als Bruch schreiben'},{m:`frac{${N}}{${a}}*frac{x*x}{x}`,n:'$x^2 = x * x$, ein $x$ kürzt sich weg'},{m:mono(b,'x',true),n:`$${N} : ${a} = ${b}$`}]}}
function gen4(){const wx=Math.random()<.4,a=rnd(2,7)*sgn(),b=rnd(1,5),c=nz(-9,9);const F=wx?mono(a,'x',true):String(a),Fp=a<0?`(${F})`:F;
  return{task:`Löse die Klammer auf: $${F}(${poly([[b,'x'],[c,'']])})$`,steps:[{m:`${F}*${mono(b,'x',true)} + ${Fp}*${sn(c)}`,n:`Den Faktor $${F}$ mit jedem Glied der Klammer multiplizieren`},{m:poly(wx?[[a*b,'x^2'],[a*c,'x']]:[[a*b,'x'],[a*c,'']]),n:'Ausrechnen, Vorzeichenregeln beachten'}]}}
function gen5(){const ty=rnd(1,4);let task,raw;const n1='Minus und Klammer weglassen, alle Vorzeichen in der Klammer umkehren';
  if(ty===1){const a=rnd(2,9),b=rnd(1,6),c=nz(-9,9);task=`${mono(a,'x',true)} - (${poly([[b,'x'],[c,'']])})`;raw=[[a,'x'],[-b,'x'],[-c,'']]}
  if(ty===2){const c=rnd(2,12),b=rnd(1,6),d=nz(-9,9);task=`${c} - (${poly([[b,'x'],[d,'']])})`;raw=[[c,''],[-b,'x'],[-d,'']]}
  if(ty===3){const a=nz(-6,6),b=nz(-9,9),c=nz(-6,6);task=`-(${poly([[a,'x'],[b,'']])})${mono(c,'x',false)}`;raw=[[-a,'x'],[-b,''],[c,'x']]}
  if(ty===4){const k=rnd(2,6),c=nz(-9,9);return{task:`Löse die Klammer auf: $-${k}(${poly([[1,'x'],[c,'']])})$`,steps:[{m:`-${k}*x + (-${k})*${sn(c)}`,n:`Den Faktor $-${k}$ mit jedem Glied multiplizieren`},{m:poly([[-k,'x'],[-k*c,'']]),n:'Ausrechnen: Minus mal Minus ergibt Plus'}]}}
  return{task:`Löse die Klammer auf und fasse zusammen: $${task}$`,steps:[{m:poly(raw),n:n1},{m:poly(combine(raw)),n:'Gleichartige Glieder zusammenfassen'}]}}
function gen6(){const g=rnd(2,6),a=rnd(1,5);let b;do b=nz(-9,9);while(gcd(a,b)!==1);const wx=Math.random()<.4;
  const F=wx?mono(g,'x',true):String(g),term=poly(wx?[[g*a,'x^2'],[g*b,'x']]:[[g*a,'x'],[g*b,'']]),inner=poly([[a,'x'],[b,'']]);
  return{task:`Klammere den größten gemeinsamen Faktor aus: $${term}$`,steps:[{m:`[[${F}]]*${mono(a,'x',true)} ${b<0?'-':'+'} [[${F}]]*${Math.abs(b)}`,n:`ggT von $${g*a}$ und $${Math.abs(g*b)}$ ist $${g}$`+(wx?', außerdem enthalten beide Glieder $x$':'')},{m:`${F}(${inner})`,n:'Gemeinsamen Faktor vor die Klammer schreiben'},{m:`${F}(${inner}) = ${term} ✓`,n:'Probe durch Ausmultiplizieren'}]}}
function gen7(){const ty=rnd(1,3);
  if(ty===1){const p=nz(-7,7),q=nz(-7,7),pr=[[1,'x^2'],[q,'x'],[p,'x'],[p*q,'']];
    return{task:`Multipliziere aus: $(${poly([[1,'x'],[p,'']])})(${poly([[1,'x'],[q,'']])})$`,steps:[{m:`x*x + x*${sn(q)} + ${sn(p)}*x + ${sn(p)}*${sn(q)}`,n:'Jedes Glied mit jedem multiplizieren'},{m:poly(pr),n:'Die vier Produkte ausrechnen'},{m:poly(combine(pr)),n:'Gleichartige Glieder zusammenfassen'}]}}
  if(ty===2){const a=rnd(2,3),b=rnd(1,3),p=nz(-5,5),q=nz(-5,5),A=mono(a,'x',true),B=mono(b,'x',true),pr=[[a*b,'x^2'],[a*q,'x'],[p*b,'x'],[p*q,'']];
    return{task:`Multipliziere aus: $(${poly([[a,'x'],[p,'']])})(${poly([[b,'x'],[q,'']])})$`,steps:[{m:`${A}*${B} + ${A}*${sn(q)} + ${sn(p)}*${B} + ${sn(p)}*${sn(q)}`,n:'Jedes Glied mit jedem multiplizieren'},{m:poly(pr),n:'Die vier Produkte ausrechnen'},{m:poly(combine(pr)),n:'Gleichartige Glieder zusammenfassen'}]}}
  const p=nz(-7,7),q=nz(-7,7);
  return{task:`Multipliziere aus: $(${poly([[1,'x'],[p,'']])})(${poly([[1,'y'],[q,'']])})$`,steps:[{m:`x*y + x*${sn(q)} + ${sn(p)}*y + ${sn(p)}*${sn(q)}`,n:'Jedes Glied mit jedem multiplizieren'},{m:poly([[1,'xy'],[q,'x'],[p,'y'],[p*q,'']]),n:'Ausrechnen. Es gibt keine gleichartigen Glieder, fertig.'}]}}
function gen8(){const ty=rnd(1,3),c=pick([1,1,2,3]),b=rnd(1,9),cx=mono(c,'x',true),sq=c===1?'x':`(${c}x)`;
  if(ty===1)return{task:`Wende eine binomische Formel an: $(${cx} + ${b})^2$`,steps:[{m:`${sq}^2 + 2*${cx}*${b} + ${b}^2`,n:`1. binomische Formel mit $a = ${cx}$ und $b = ${b}$`},{m:poly([[c*c,'x^2'],[2*c*b,'x'],[b*b,'']]),n:'Ausrechnen'}]};
  if(ty===2)return{task:`Wende eine binomische Formel an: $(${cx} - ${b})^2$`,steps:[{m:`${sq}^2 - 2*${cx}*${b} + ${b}^2`,n:`2. binomische Formel mit $a = ${cx}$ und $b = ${b}$`},{m:poly([[c*c,'x^2'],[-2*c*b,'x'],[b*b,'']]),n:'Ausrechnen'}]};
  return{task:`Wende eine binomische Formel an: $(${cx} + ${b})(${cx} - ${b})$`,steps:[{m:`${sq}^2 - ${b}^2`,n:`3. binomische Formel mit $a = ${cx}$ und $b = ${b}$`},{m:poly([[c*c,'x^2'],[-b*b,'']]),n:'Ausrechnen'}]}}
function gen9(){const ty=rnd(1,4),no={n:'Frage 1: kein gemeinsamer Faktor',q:1};
  if(ty===1){const g=rnd(2,6),a=rnd(1,5);let b;do b=nz(-9,9);while(gcd(a,b)!==1);const wx=Math.random()<.5,F=wx?mono(g,'x',true):String(g);
    const term=poly(wx?[[g*a,'x^2'],[g*b,'x']]:[[g*a,'x'],[g*b,'']]);
    return{task:`Faktorisiere: $${term}$`,steps:[{m:`[[${F}]]*${mono(a,'x',true)} ${b<0?'-':'+'} [[${F}]]*${Math.abs(b)}`,n:`Frage 1: gemeinsamer Faktor? Ja, $${F}$`,q:1},{m:`${F}(${poly([[a,'x'],[b,'']])})`,n:'Ausklammern. In der Klammer geht nichts mehr, fertig.',q:1}]}}
  if(ty===2){const c=pick([1,1,2,3]);let b;do b=rnd(1,9);while(gcd(c,b)!==1);const cx=mono(c,'x',true),sq=c===1?'x':`(${c}x)`,term=poly([[c*c,'x^2'],[-b*b,'']]);
    return{task:`Faktorisiere: $${term}$`,steps:[{m:term,...no},{m:`${sq}^2 - ${b}^2`,n:'Frage 2: Differenz zweier Quadrate? Ja',q:2},{m:`(${cx} + ${b})(${cx} - ${b})`,n:'3. binomische Formel rückwärts',q:2}]}}
  if(ty===3){const s=sgn(),c=pick([1,1,1,2]);let b;do b=rnd(1,9);while(gcd(c,b)!==1);const cx=mono(c,'x',true),sq=c===1?'x':`(${c}x)`,o=s<0?'-':'+',term=poly([[c*c,'x^2'],[2*s*c*b,'x'],[b*b,'']]);
    return{task:`Faktorisiere: $${term}$`,steps:[{m:term,...no},{m:`${sq}^2 ${o} 2*${cx}*${b} + ${b}^2`,n:`Frage 3: Quadrate $${sq}^2$ und $${b}^2$, das mittlere Glied ist das doppelte Produkt`,q:3},{m:`(${cx} ${o} ${b})^2`,n:`${s<0?2:1}. binomische Formel rückwärts`,q:3}]}}
  const g=rnd(2,5),s=sgn(),b=rnd(1,6),o=s<0?'-':'+';
  return{task:`Faktorisiere: $${poly([[g,'x^2'],[2*s*g*b,'x'],[g*b*b,'']])}$`,steps:[{m:`${g}(${poly([[1,'x^2'],[2*s*b,'x'],[b*b,'']])})`,n:`Frage 1: gemeinsamer Faktor $${g}$, ausklammern`,q:1},{m:`${g}(x^2 ${o} 2*x*${b} + ${b}^2)`,n:'Frage 3: In der Klammer steht eine binomische Formel',q:3},{m:`${g}(x ${o} ${b})^2`,n:'Vollständig faktorisiert',q:3}]}}

/* ---------- Aufbau ---------- */
function buildPanel(t,k,panel){
  const p='t'+k;
  panel.innerHTML=`
  <div class="lead">
    <div class="intro"><p class="eyebrow">Reiter ${k} von 9</p><h2>${t.title}</h2><p>${T(t.intro)}</p></div>
    <aside class="merke"><h3>Merke</h3><div>${T(t.merke)}</div></aside>
  </div>
  <div class="grid2">
    <article class="card ex">
      <div class="ch"><h3>Beispiel</h3><div class="chips">${t.examples.map((e,j)=>`<button class="chipb${j?'':' on'}" data-e="${j}" aria-pressed="${!j}">${e.label}</button>`).join('')}</div></div>
      <div class="arcwrap"></div>
      <div class="steps" aria-live="polite"></div>
      <div class="row"><button class="btn" data-a="prev">Zurück</button><button class="btn pri" data-a="next">Nächster Schritt →</button><button class="btn ghost" data-a="reset">Zurücksetzen</button><span class="cnt"></span></div>
    </article>
    <article class="card vis"><div class="ch"><h3>Anschauung</h3></div><div class="vb"></div></article>
  </div>
  <div class="grid2 b">
    <article class="card prac">
      <div class="ch"><h3>Selbst ausprobieren</h3></div>
      <p class="task"></p>
      <div class="steps" aria-live="polite"></div>
      <div class="row"><button class="btn pri" data-a="next">Nächster Lösungsschritt</button><button class="btn" data-a="all">Ganze Lösung</button><button class="btn ghost" data-a="new">Neue Aufgabe</button></div>
    </article>
    <article class="card trap"><h3><span class="bang">!</span>Achtung, Fehlerfalle!</h3><div>${T(t.trap)}</div></article>
  </div>`;
  t.vis(panel.querySelector('.vb'),t,p);
  const setQ=s=>t.setQ&&t.setQ(s&&s.q||0);
  const ex=panel.querySelector('.ex'),st=makeStepper(ex,{start:1,onStep:setQ}),aw=ex.querySelector('.arcwrap');
  function loadEx(j){ex.querySelectorAll('[data-e]').forEach(b=>{const on=+b.dataset.e===j;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});const e=t.examples[j];aw.innerHTML=e.arcs?arcFig(e.arcs.t,e.arcs.a):'';aw.hidden=!e.arcs;st.load(e.steps)}
  ex.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.e!==undefined)loadEx(+b.dataset.e);const a=b.dataset.a;if(a&&st[a])st[a]()});
  const pr=panel.querySelector('.prac'),ps=makeStepper(pr,{start:0,onStep:s=>s&&setQ(s)});
  function newTask(){const g=t.gen();pr.querySelector('.task').innerHTML=T(g.task);ps.load(g.steps)}
  pr.addEventListener('click',ev=>{const a=ev.target.closest('[data-a]')?.dataset.a;if(a==='new')newTask();else if(a&&ps[a])ps[a]()});
  loadEx(0);newTask();
  panel._st=st;
}

function init(){
  const nav=document.querySelector('.tabs'),main=document.querySelector('main');let cur=0;
  nav.innerHTML=TABS.map((t,i)=>`<button role="tab" class="tb" id="tb-${i+1}" aria-controls="p-${i+1}" aria-selected="false"><span class="tn">${i+1}</span><span class="tl">${t.short}</span></button>`).join('');
  main.innerHTML=TABS.map((t,i)=>`<section role="tabpanel" id="p-${i+1}" aria-labelledby="tb-${i+1}" hidden></section>`).join('');
  function show(k,push=true){if(k<1||k>9)return;cur=k;
    TABS.forEach((t,i)=>{const on=i+1===k,b=document.getElementById('tb-'+(i+1)),pn=document.getElementById('p-'+(i+1));b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;pn.hidden=!on;if(on&&!pn.dataset.built){buildPanel(t,k,pn);pn.dataset.built=1}});
    document.getElementById('tb-'+k).scrollIntoView({block:'nearest',inline:'nearest'});
    if(push&&location.hash!=='#reiter-'+k)history.replaceState(null,'','#reiter-'+k)}
  nav.addEventListener('click',e=>{const b=e.target.closest('.tb');if(b)show(+b.id.slice(3))});
  const fromHash=()=>{const m=/^#reiter-([1-9])$/.exec(location.hash);return m?+m[1]:1};
  window.addEventListener('hashchange',()=>show(fromHash(),false));
  show(fromHash(),false);
  document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea'))return;
    const st=document.getElementById('p-'+cur)._st;
    if(e.key==='ArrowRight'&&!e.target.closest('.tabs')){st&&st.next();e.preventDefault()}
    else if(e.key==='ArrowLeft'&&!e.target.closest('.tabs')){st&&st.prev();e.preventDefault()}
    else if(/^[1-9]$/.test(e.key))show(+e.key)});
  const scales=[.8,.9,1,1.12,1.25,1.4,1.6];let si=2;
  try{const raw=localStorage.getItem('tw-scale');const v=+raw;if(raw!==null&&v>=0&&v<scales.length)si=v}catch(_){}
  const applyScale=()=>{document.documentElement.style.fontSize=(19*scales[si])+'px';try{localStorage.setItem('tw-scale',si)}catch(_){}};applyScale();
  document.getElementById('fsm').onclick=()=>{if(si>0){si--;applyScale()}};
  document.getElementById('fsp').onclick=()=>{if(si<scales.length-1){si++;applyScale()}};
  const root=document.documentElement,tb=document.getElementById('theme');
  const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const setTheme=m=>{root.dataset.theme=m;tb.textContent=m==='dark'?'Hell':'Dunkel';tb.title=m==='dark'?'Zum hellen Modus wechseln':'Zum dunklen Modus wechseln'};
  try{const s=localStorage.getItem('tw-theme');if(s==='dark'||s==='light')setTheme(s);else setTheme(isDark()?'dark':'light')}catch(_){setTheme(isDark()?'dark':'light')}
  tb.onclick=()=>{const m=isDark()?'light':'dark';setTheme(m);try{localStorage.setItem('tw-theme',m)}catch(_){}};
  const fb=document.getElementById('full');
  if(!document.documentElement.requestFullscreen)fb.hidden=true;
  fb.onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(_){}};
  document.addEventListener('fullscreenchange',()=>fb.textContent=document.fullscreenElement?'Vollbild beenden':'Vollbild');
}
if(typeof window!=='undefined')init();
</script>
