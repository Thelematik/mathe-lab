<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematik: Labore, Tools und Übungen</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style id="typo-basis">
/* Platz für die Scrollleiste immer freihalten, damit nichts springt, wenn die Seite länger wird */
html{scrollbar-gutter:stable}
/* Einheitliche Schriften: Text Source Sans 3, Überschriften Source Serif 4, Zahlen Source Code Pro */
html{font-size:20px}
body{font-family:"Source Sans 3", system-ui, sans-serif}
h1,h2,h3{font-family:"Source Serif 4", Georgia, serif}
button,input,select,textarea{font-family:inherit}
code,kbd,samp,pre{font-family:"Source Code Pro", ui-monospace, monospace}
</style>
<style>
  :root {
    --ink: #1f3a5f;
    --ink-soft: #4a6489;
    --paper: #fbfaf6;
    --grid: #e3e8ef;
    --margin: #d9534f;
    --card: #ffffff;
    --line: #d6dde6;
    --tool: #2e7d6b;
    --labor: #7b4fa3;
    --erklaerung: #2a6fb0;
    --uebung: #c06a1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family:"Source Sans 3", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    line-height: 1.5;
  }
  header {
    background: var(--paper);
    border-bottom: 2px solid var(--margin);
    padding: 2.2rem 1.25rem 1.6rem;
  }
  .wrap { max-width: 1050px; margin: 0 auto; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    margin: 0 0 .3rem;
    letter-spacing: .01em;
  }
  .sub { margin: 0; color: var(--ink-soft); font-size: 1.05rem; }

  main { padding: 1.5rem 1.25rem 3rem; }

  .controls {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 1px 3px rgba(31,58,95,.06);
  }
  .search {
    width: 100%;
    font-size: 1rem;
    padding: .65rem .85rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    margin-bottom: .8rem;
  }
  .search:focus { outline: 2px solid var(--erklaerung); border-color: transparent; }
  .row { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
  .row + .row { margin-top: .55rem; }
  .row-label { font-size: .85rem; color: var(--ink-soft); margin-right: .25rem; min-width: 5.5rem; }
  .chip {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: .35rem .8rem;
    border-radius: 999px;
    font-size: .9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--ink-soft); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  section.cat { margin-bottom: 2.2rem; }
  section.cat h2 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.45rem;
    margin: 0 0 .2rem;
  }
  section.cat .cat-desc { margin: 0 0 .9rem; color: var(--ink-soft); font-size: .95rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: .9rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem 1rem .9rem;
    display: flex;
    flex-direction: column;
    gap: .45rem;
    text-decoration: none;
    color: inherit;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(31,58,95,.12); }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .card p { margin: 0; font-size: .92rem; color: var(--ink-soft); flex-grow: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: .35rem; font-size: .78rem; }
  .badge { padding: .12rem .55rem; border-radius: 999px; color: #fff; font-weight: 600; }
  .badge.Tool { background: var(--tool); }
  .badge.Labor { background: var(--labor); }
  .badge.Erklärung { background: var(--erklaerung); }
  .badge.Übung { background: var(--uebung); }
  .badge.stufe { background: #eef2f7; color: var(--ink); font-weight: 500; }
  .card.soon { opacity: .6; border-style: dashed; }
  .soon-note { font-size: .8rem; font-style: italic; color: var(--ink-soft); }

  .empty { text-align: center; color: var(--ink-soft); padding: 2rem 0; }

  footer {
    border-top: 1px solid var(--line);
    background: var(--paper);
    padding: 1.2rem 1.25rem;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  footer a { color: var(--ink); }

/* Zeilenumbrüche und Filter auf kleinen Bildschirmen */
h1, h2, h3, .card h3 { text-wrap: balance; }
p { text-wrap: pretty; }
.row { position: relative; padding-left: 6rem; }
.row-label { position: absolute; left: 0; top: .5rem; min-width: 0; margin: 0; }
@media (max-width: 640px) {
  header { padding-left: 1.1rem; padding-right: 1.1rem; }
  header h1 { font-size: clamp(1.6rem, 7.5vw, 2.2rem); }
  .row { padding-left: 0; }
  .row-label { position: static; flex-basis: 100%; margin-bottom: .1rem; }
  .chip { padding: .3rem .75rem; font-size: .88rem; }
  .search { font-size: .95rem; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Mathematik zum Ausprobieren</h1>
    <p class="sub">Interaktive Tools, Labore, Erklärungen und Übungen für den Unterricht</p>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Suchen, z. B. Ableitung, Bruch, Pythagoras …" aria-label="Suchen">
    <div class="row" id="stufen-row"><span class="row-label">Stufe:</span></div>
    <div class="row" id="typen-row"><span class="row-label">Art:</span></div>
  </div>

  <div id="content"></div>
</main>

<footer>
  <div class="wrap">
    Verantwortlich: S. Thel ·
    <a href="impressum.html">Impressum</a> ·
    <a href="../POWI/">Zur Seite Politik und Wirtschaft</a> ·
    Diese Seite verwendet keine Cookies und überträgt keine Daten an Dritte.
  </div>
</footer>

<script>
/* =========================================================
   HIER PFLEGST DU DEINE INHALTE
   Für ein neues Tool einfach einen Eintrag kopieren und anpassen.
   link: Pfad zur Datei (z. B. "q3/ableitung.html").
         Leer lassen ("") = wird als "in Vorbereitung" angezeigt.
   typ:  "Tool", "Labor", "Erklärung" oder "Übung"
   kategorie: muss einer der Kategorien unten entsprechen
   ========================================================= */

const KATEGORIEN = [
  { id: "unterstufe",  name: "Unterstufe",          stufe: "5 bis 7",  beschreibung: "Rechnen, Brüche, Geometrie" },
  { id: "mittelstufe", name: "Mittelstufe",         stufe: "8 bis 10", beschreibung: "Funktionen, Pythagoras, Trigonometrie, Wahrscheinlichkeit" },
  { id: "oberstufe",   name: "Oberstufe",           stufe: "E und Q",  beschreibung: "Analysis, Lineare Algebra und Analytische Geometrie, Stochastik" }
];

const INHALTE = [
  { titel: "Koordinaten entdecken", beschreibung: "Vom Schachbrett zum Koordinatensystem: Felder finden, Punkte ablesen, eintragen und Figuren zeichnen.", kategorie: "unterstufe", typ: "Übung", link: "unterstufe/koordinaten-entdecken.html" },
  { titel: "Brüche addieren und subtrahieren (Video)", beschreibung: "Kurzes Erklärvideo: gleiche Nenner, Hauptnenner finden, erweitern, Zähler zusammenrechnen und kürzen.", kategorie: "unterstufe", typ: "Erklärung", link: "unterstufe/brueche-addieren-subtrahieren.html" },
  { titel: "Brüche multiplizieren und dividieren (Video)", beschreibung: "Kurzes Erklärvideo: Multiplizieren am Flächenmodell, über Kreuz kürzen, Kehrwert bilden und Brüche dividieren.", kategorie: "unterstufe", typ: "Erklärung", link: "unterstufe/brueche-multiplizieren-dividieren.html" },
  { titel: "Bruchrechen-Trainer", beschreibung: "Zufällige Aufgaben zum Kürzen, Erweitern und Addieren mit sofortiger Rückmeldung.", kategorie: "unterstufe", typ: "Übung", link: "" },
  { titel: "Winkel messen", beschreibung: "Ein virtuelles Geodreieck zum Messen und Zeichnen von Winkeln.", kategorie: "unterstufe", typ: "Tool", link: "" },
  { titel: "Vorbereitung auf den Mathewettbewerb 8", beschreibung: "Aufgabenfelder des Mathematik-Wettbewerbs Hessen: W1 Gleichungen, W2 Dreieckskonstruktionen und W4 Wahrscheinlichkeitsrechnung.", kategorie: "mittelstufe", typ: "Übung", link: "mittelstufe/mathewettbewerb-8.html" },
  { titel: "Termwerkstatt", beschreibung: "Grundlagen der Algebra für Klasse 8: Terme anschaulich mit Streichhölzern und Rechtecken, sortieren, Klammern auflösen und ausklammern.", kategorie: "mittelstufe", typ: "Übung", link: "mittelstufe/termwerkstatt.html" },
  { titel: "Wahrscheinlichkeit anschaulich", beschreibung: "Laplace-Wahrscheinlichkeit, Baumdiagramme und Pfadregeln, Ziehen mit und ohne Zurücklegen.", kategorie: "mittelstufe", typ: "Erklärung", link: "mittelstufe/wahrscheinlichkeit-anschaulich.html" },
  { titel: "Trigonometrie am Dreieck", beschreibung: "Von ähnlichen Dreiecken über Sinus, Kosinus und Tangens bis zum Einheitskreis und den Graphen.", kategorie: "mittelstufe", typ: "Erklärung", link: "mittelstufe/trigonometrie-am-dreieck.html" },
  { titel: "Sinussatz und Kosinussatz herleiten", beschreibung: "Schritt für Schritt an einem verschiebbaren Dreieck hergeleitet, mit Messwerten zur Kontrolle.", kategorie: "mittelstufe", typ: "Erklärung", link: "mittelstufe/sinussatz-kosinussatz.html" },
  { titel: "Trigonometrie im Würfel, Quader und besonderen Vierecken", beschreibung: "Winkel und Längen in Würfel und Quader in 3D berechnen, dazu Dreieck, Raute und Drachenviereck.", kategorie: "mittelstufe", typ: "Labor", link: "mittelstufe/wuerfel-raumdiagonalen.html" },
  { titel: "Lineare Funktionen erkunden", beschreibung: "Von der Taxifahrt zur Geraden: Steigung mit dem Steigungsdreieck, y-Achsenabschnitt, Nullstelle, Gleichung bestimmen und Schnittpunkt zweier Geraden.", kategorie: "mittelstufe", typ: "Labor", link: "mittelstufe/lineare-funktionen.html" },
  { titel: "Satz des Pythagoras", beschreibung: "Schritt für Schritt erklärt, mit einem anschaulichen Beweis zum Durchklicken.", kategorie: "mittelstufe", typ: "Erklärung", link: "" },
  { titel: "Zufallsexperimente", beschreibung: "Würfel und Münzen tausendfach werfen und die relative Häufigkeit beobachten.", kategorie: "mittelstufe", typ: "Labor", link: "" },
  { titel: "Auswertungsblatt: Würfelexperiment", beschreibung: "Gruppenarbeit für bis zu 10 Gruppen: absolute und relative Häufigkeit beim einfachen und zweifachen Würfelwurf, empirisches Gesetz der großen Zahlen (Excel).", kategorie: "oberstufe", typ: "Übung", link: "oberstufe/arbeitsblaetter/wuerfelexperiment-gesetz-der-grossen-zahlen.xlsx" },
  { titel: "Die eulersche Zahl e", beschreibung: "Leonhard Euler und die Geschichte von e, die Suche nach einer Funktion mit f' = f und der Grenzwert von (1 + 1/n)ⁿ beim Zinseszins.", kategorie: "oberstufe", typ: "Erklärung", link: "oberstufe/eulersche-zahl.html" },
  { titel: "Galton-Brett: Binomialkoeffizient", beschreibung: "Wege durch das Galton-Brett zählen, alle Pfade zeigen lassen und das pascalsche Dreieck entdecken. Simulation 1 zum Arbeitsblatt.", kategorie: "oberstufe", typ: "Labor", link: "oberstufe/galton-brett.html" },
  { titel: "Galton-Brett: Formel von Bernoulli", beschreibung: "Mit verstellbarer Wahrscheinlichkeit p von der Wahrscheinlichkeit eines Weges zur Formel von Bernoulli. Simulation 2 zum Arbeitsblatt.", kategorie: "oberstufe", typ: "Labor", link: "oberstufe/galton-bernoulli.html" },
  { titel: "Arbeitsblatt: Vom Galton-Brett zur Formel von Bernoulli", beschreibung: "Vier Seiten zu beiden Galton-Simulationen: Wege abzählen, Binomialkoeffizient, Pfadregeln und Formel von Bernoulli (PDF).", kategorie: "oberstufe", typ: "Übung", link: "oberstufe/arbeitsblaetter/galton-bernoulli.pdf" },
  { titel: "Binomialverteilung", beschreibung: "Parameter n und p verändern und Histogramm, kumulierte Verteilung und Kenngrößen live verfolgen, dazu systematisches Probieren bei inversen Fragestellungen.", kategorie: "oberstufe", typ: "Labor", link: "oberstufe/binomialverteilung.html" },
  { titel: "Gauß-Labor Normalverteilung", beschreibung: "Die Normalverteilung erkunden: Glockenkurve, Erwartungswert, Standardabweichung und Wahrscheinlichkeiten.", kategorie: "oberstufe", typ: "Labor", link: "oberstufe/normalverteilung.html" },
  { titel: "Hypothesentest-Labor", beschreibung: "Entscheidungsregeln durch Probieren finden, Fehler 1. und 2. Art, Operationscharakteristik und Gütefunktion.", kategorie: "oberstufe", typ: "Labor", link: "oberstufe/hypothesentest.html" },
  { titel: "Funktionsplotter", beschreibung: "Beliebige Funktionen zeichnen, Nullstellen und Extrema ablesen.", kategorie: "oberstufe", typ: "Tool", link: "" },
  { titel: "Von der Sekante zur Tangente", beschreibung: "Vom Fallexperiment zur Ableitung: Sekanten werden zu Tangenten, mit x-Methode oder h-Methode, exakter Rechnung, Tangente und Normale und Quiz.", kategorie: "oberstufe", typ: "Labor", link: "oberstufe/sekante-tangente.html" },
  { titel: "Ableitungsregeln üben", beschreibung: "Aufgaben zu Produkt- und Kettenregel mit Lösungsweg.", kategorie: "oberstufe", typ: "Übung", link: "" }
];

/* ========= Ab hier musst du nichts mehr ändern ========= */

const TYPEN = ["Tool", "Labor", "Erklärung", "Übung"];
let aktiveStufe = "alle";
let aktiverTyp = "alle";
let suchtext = "";

function chip(label, value, gruppe) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = label;
  b.dataset.value = value;
  b.addEventListener("click", () => {
    if (gruppe === "stufe") aktiveStufe = value; else aktiverTyp = value;
    aktualisiereChips();
    render();
  });
  return b;
}

function baueFilter() {
  const sRow = document.getElementById("stufen-row");
  sRow.appendChild(chip("Alle", "alle", "stufe"));
  KATEGORIEN.forEach(k => sRow.appendChild(chip(k.name, k.id, "stufe")));
  const tRow = document.getElementById("typen-row");
  tRow.appendChild(chip("Alle", "alle", "typ"));
  TYPEN.forEach(t => tRow.appendChild(chip(t, t, "typ")));
  aktualisiereChips();
}

function aktualisiereChips() {
  document.querySelectorAll("#stufen-row .chip").forEach(c =>
    c.classList.toggle("active", c.dataset.value === aktiveStufe));
  document.querySelectorAll("#typen-row .chip").forEach(c =>
    c.classList.toggle("active", c.dataset.value === aktiverTyp));
}

function passt(item) {
  if (aktiveStufe !== "alle" && item.kategorie !== aktiveStufe) return false;
  if (aktiverTyp !== "alle" && item.typ !== aktiverTyp) return false;
  if (suchtext) {
    const t = (item.titel + " " + item.beschreibung).toLowerCase();
    if (!t.includes(suchtext)) return false;
  }
  return true;
}

function karte(item) {
  const el = document.createElement(item.link ? "a" : "div");
  el.className = "card" + (item.link ? "" : " soon");
  if (item.link) el.href = item.link;
  const h = document.createElement("h3"); h.textContent = item.titel;
  const p = document.createElement("p"); p.textContent = item.beschreibung;
  const meta = document.createElement("div"); meta.className = "meta";
  const b = document.createElement("span"); b.className = "badge " + item.typ; b.textContent = item.typ;
  meta.appendChild(b);
  el.append(h, p, meta);
  if (!item.link) {
    const s = document.createElement("span"); s.className = "soon-note"; s.textContent = "in Vorbereitung";
    el.appendChild(s);
  }
  return el;
}

function render() {
  const c = document.getElementById("content");
  c.innerHTML = "";
  let gefunden = 0;
  KATEGORIEN.forEach(k => {
    const items = INHALTE.filter(i => i.kategorie === k.id && passt(i));
    if (!items.length) return;
    gefunden += items.length;
    const sec = document.createElement("section"); sec.className = "cat";
    const h = document.createElement("h2"); h.textContent = k.name + " (" + k.stufe + ")";
    const d = document.createElement("p"); d.className = "cat-desc"; d.textContent = k.beschreibung;
    const g = document.createElement("div"); g.className = "grid";
    items.forEach(i => g.appendChild(karte(i)));
    sec.append(h, d, g);
    c.appendChild(sec);
  });
  if (!gefunden) {
    c.innerHTML = '<p class="empty">Keine passenden Inhalte gefunden.</p>';
  }
}

document.getElementById("search").addEventListener("input", e => {
  suchtext = e.target.value.trim().toLowerCase();
  render();
});

baueFilter();
render();
</script>
</body>
</html>
